<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap');

  *{box-sizing:border-box;margin:0;padding:0;}

  /* ══════════════════════════════════════════════
     KITAcore Design System — "Less, but better"
     ウォームグレー基調 / 影なし / 8ptグリッド / 罫線1px
     アクセント: 黒（構造）＋ オレンジ（ブランドの一点）
     ══════════════════════════════════════════════ */
  :root{
    --orange:#f97316; --orange2:#ea6a0e;
    --pos:#3f8f4f; --neg:#c2403f;
    --fh:'Inter','Noto Sans JP',sans-serif;          /* 見出し */
    --fd:'JetBrains Mono',monospace;                  /* 数値・データ */
    --fj:'Noto Sans JP','Hiragino Sans',sans-serif;   /* 本文 */
    --fm:'JetBrains Mono','IBM Plex Mono',monospace;  /* ラベル・キャプション */
    --fs:'JetBrains Mono',monospace;
    --maxw:1160px;
    --r:4px; --r2:2px;
    --tr:150ms ease;
  }
  :root, :root[data-theme="light"]{
    --bg:#E9E9E9; --bg2:#E2E2E0; --surface:#FFFFFF; --card:#FFFFFF; --card2:#F4F4F2;
    --line:#DDDDDD; --line2:#BBBBBB;
    --text:#111111; --text2:#333333; --mut:#6B6B6B; --mut2:#4D4D4D; --faint:#9A9A96;
    --acc:#111111; --acc-text:#FFFFFF;
    --ink2:#F4F4F2;
    --navbg:rgba(233,233,233,.92);
    --gold-card:#FBF1E5;
    --scan:rgba(0,0,0,.025);
    --shadow:none;
    --grid-line:rgba(17,17,17,.04);
    --muted:var(--mut); --muted2:var(--mut2); --border:var(--line); --border2:var(--line2); --ink3:var(--card2);
  }
  :root[data-theme="dark"]{
    --bg:#141416; --bg2:#1A1A1D; --surface:#1E1E22; --card:#1E1E22; --card2:#26262B;
    --line:#303036; --line2:#4A4A52;
    --text:#ECEAE4; --text2:#CFCDC6; --mut:#8E8C86; --mut2:#B0AEA7; --faint:#5E5C58;
    --acc:#ECEAE4; --acc-text:#141416;
    --ink2:#1A1A1D;
    --navbg:rgba(20,20,22,.9);
    --gold-card:#241509;
    --scan:rgba(255,255,255,.02);
    --shadow:none;
    --grid-line:rgba(236,234,228,.04);
    --muted:var(--mut); --muted2:var(--mut2); --border:var(--line); --border2:var(--line2); --ink3:var(--card2);
  }

  html{scroll-behavior:smooth;}
  body{background:var(--bg);color:var(--text);font-family:var(--fj);letter-spacing:.02em;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background var(--tr),color var(--tr);}

  /* 紙のようなグレイン */
  body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");opacity:.018;pointer-events:none;z-index:9999;}

  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  @keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  @keyframes scan{to{transform:translateY(calc(100vh + 180px))}}
  .fu{animation:fadeUp .6s cubic-bezier(.22,1,.36,1) both}
  .d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.28s}.d4{animation-delay:.4s}
  .page-fade{animation:fadeIn .35s ease both;counter-reset:sec;}

  /* ══════════ レイアウト基礎 ══════════ */
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 32px;}
  .sec{padding:96px 0;}
  .sec.alt{background:var(--bg2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}

  /* セクション番号付きアイブロウ（01. 02. …自動採番） */
  .eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--fm);font-size:11px;letter-spacing:3px;color:var(--mut);text-transform:uppercase;margin-bottom:16px;}
  .eyebrow::before{counter-increment:sec;content:counter(sec,decimal-leading-zero) ".";color:var(--orange);font-weight:700;}
  .eyebrow .rule{width:24px;height:1px;background:var(--line2);display:inline-block;flex-shrink:0;}

  .sec-title{font-family:var(--fh);font-weight:800;font-size:clamp(28px,5vw,46px);line-height:1.12;letter-spacing:-0.01em;color:var(--text);margin-bottom:8px;}
  .sec-lead{font-size:14px;color:var(--mut2);line-height:1.8;max-width:560px;margin-top:16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);transition:border-color var(--tr),background var(--tr);}
  .panel{padding:24px;}
  .panel-label{font-family:var(--fm);font-size:10px;letter-spacing:2px;color:var(--mut);margin-bottom:12px;text-transform:uppercase;}
  .badge{display:inline-block;padding:3px 10px;border-radius:var(--r2);font-size:10px;font-family:var(--fm);font-weight:700;letter-spacing:1px;text-transform:uppercase;}
  .btn-primary{display:inline-block;padding:12px 24px;border-radius:var(--r2);background:var(--acc);color:var(--acc-text);font-family:var(--fm);font-size:12px;font-weight:700;letter-spacing:2px;text-decoration:none;border:none;cursor:pointer;white-space:nowrap;transition:background var(--tr),color var(--tr);}
  .btn-primary:hover{background:var(--orange);color:#fff;}

  /* ══════════ ナビゲーション ══════════ */
  .topnav{position:sticky;top:0;z-index:100;background:var(--navbg);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;height:56px;padding:0 28px;gap:24px;}
  .nav-logo{font-family:var(--fh);font-weight:800;font-size:15px;letter-spacing:2px;color:var(--text);flex-shrink:0;display:flex;align-items:center;}
  .nav-logo .sub{font-weight:400;font-size:12px;letter-spacing:1px;color:var(--mut);}
  .nav-tabs{display:flex;gap:4px;margin:0 auto;}
  .nav-tab{border:none;background:none;cursor:pointer;font-family:var(--fm);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--mut);height:56px;padding:0 16px;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color var(--tr),border-color var(--tr);}
  .nav-tab:hover{color:var(--text);}
  .nav-tab.on{color:var(--text);border-bottom-color:var(--orange);}
  .nav-right{display:flex;align-items:center;gap:12px;font-family:var(--fm);font-size:9px;letter-spacing:1px;color:var(--faint);flex-shrink:0;margin-left:auto;}
  .nav-right a{color:var(--orange);text-decoration:none;}
  .botnav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--navbg);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;align-items:stretch;justify-content:center;height:52px;}
  .botnav .nav-tab{border-bottom:none;border-top:2px solid transparent;margin-top:-1px;height:52px;padding:0 12px;font-size:10px;}
  .botnav .nav-tab.on{border-top-color:var(--orange);}
  @media(min-width:861px){.botnav{display:none;}.appshell{padding-bottom:0;}}
  @media(max-width:860px){.nav-tabs{display:none;}.appshell{padding-bottom:64px;}}

  /* ══════════ ヒーロー / KPI ══════════ */
  .hero{position:relative;padding:120px 0 88px;overflow:hidden;}
  /* 8ptブループリントグリッド */
  .hero::before{content:'';position:absolute;inset:0;background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);background-size:64px 64px;pointer-events:none;}
  .hero-title{font-family:var(--fh);font-weight:800;font-size:clamp(48px,9.5vw,112px);line-height:1.02;letter-spacing:-0.02em;color:var(--text);}
  .hero-title .o{color:var(--orange);}
  .hero-title .stroke{color:var(--text);}
  .hero-sub{margin-top:24px;max-width:560px;color:var(--mut2);font-size:14px;line-height:1.9;}
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:56px;}
  .kpi{padding:20px;display:flex;flex-direction:column;}
  .kpi:hover{border-color:var(--line2);}
  .kpi-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .kpi-label{font-family:var(--fm);font-size:10px;letter-spacing:2px;color:var(--mut);text-transform:uppercase;}
  .kpi-diff{font-family:var(--fm);font-size:10px;padding:2px 8px;border-radius:var(--r2);white-space:nowrap;}
  .kpi-diff.up{color:var(--pos);background:rgba(63,143,79,.1);border:1px solid rgba(63,143,79,.25);}
  .kpi-diff.down{color:var(--neg);background:rgba(194,64,63,.08);border:1px solid rgba(194,64,63,.25);}
  .kpi-num{font-family:var(--fd);font-weight:600;font-size:clamp(26px,3.6vw,38px);line-height:1;margin-top:14px;letter-spacing:-0.02em;}
  .kpi-spark{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;}
  .kpi-note{margin-top:10px;font-size:11px;color:var(--mut);line-height:1.6;}

  /* ══════════ ティッカー ══════════ */
  .ticker-wrap{overflow:hidden;white-space:nowrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;background:var(--ink2);}
  .ticker-inner{display:inline-block;animation:ticker 32s linear infinite;font-family:var(--fm);font-size:11px;letter-spacing:2px;color:var(--mut2);}
  .ticker-wrap:hover .ticker-inner{animation-play-state:paused;}
  .live-dot{width:6px;height:6px;border-radius:50%;background:var(--orange);display:inline-block;animation:pulse 1.6s infinite;}

  /* ══════════ ダッシュボードセクション ══════════ */
  .growth-grid{display:grid;grid-template-columns:1fr 1.25fr;gap:48px;align-items:center;}
  .stat-pair{display:flex;gap:32px;margin-top:32px;}
  .stat-pair .item{border-left:2px solid var(--line2);padding-left:16px;}
  .stat-pair .item.b{border-left-color:var(--text);}
  .stat-pair .num{font-family:var(--fd);font-weight:600;font-size:28px;line-height:1;}
  .stat-pair .lab{font-family:var(--fm);font-size:10px;letter-spacing:1px;color:var(--mut);margin-top:6px;text-transform:uppercase;}

  .stack-bar{display:flex;height:12px;border-radius:var(--r2);overflow:hidden;gap:2px;margin:32px 0 24px;}
  .stack-bar span{display:block;height:100%;min-width:4px;transition:width .8s cubic-bezier(.22,1,.36,1);}
  .trend-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  .trend-chip{padding:18px 20px;}
  .trend-chip .tc-head{display:flex;align-items:baseline;gap:8px;}
  .trend-chip .tc-emoji{font-size:13px;}
  .trend-chip .tc-num{font-family:var(--fd);font-weight:600;font-size:32px;line-height:1;}
  .trend-chip .tc-pct{font-size:11px;color:var(--mut);margin-left:auto;font-family:var(--fm);}
  .trend-chip .tc-desc{font-size:11px;color:var(--mut);line-height:1.7;margin-top:12px;}

  .seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r2);padding:0;gap:0;background:var(--card);overflow:hidden;}
  .seg button{border:none;background:none;font-family:var(--fm);font-size:11px;letter-spacing:1px;padding:9px 18px;color:var(--mut);cursor:pointer;transition:background var(--tr),color var(--tr);border-right:1px solid var(--line);}
  .seg button:last-child{border-right:none;}
  .seg button.on{background:var(--acc);color:var(--acc-text);}
  .seg button.on.b{background:var(--acc);}

  .t5-link{text-decoration:none;display:block;}
  .t5-row{display:grid;grid-template-columns:56px 30px 1fr auto;gap:16px;align-items:center;padding:18px 12px;border-bottom:1px solid var(--line);cursor:pointer;transition:background var(--tr);}
  .t5-row:hover{background:var(--card2);}
  .t5-rank{font-family:var(--fd);font-size:26px;color:var(--faint);line-height:1;text-align:right;}
  .t5-emoji{font-size:16px;text-align:center;}
  .t5-title{font-size:14px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .t5-bar{height:2px;background:var(--line);border-radius:1px;margin-top:9px;overflow:hidden;}
  .t5-bar span{display:block;height:100%;transition:width .8s cubic-bezier(.22,1,.36,1);}
  .t5-avg{font-size:10px;color:var(--mut);margin-top:6px;font-family:var(--fm);}
  .t5-val{font-family:var(--fd);font-weight:600;font-size:22px;line-height:1;text-align:right;}
  .t5-val span{display:block;font-family:var(--fm);font-weight:400;font-size:9px;letter-spacing:1px;color:var(--faint);margin-top:5px;}

  .gems-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .gem{padding:24px;height:100%;position:relative;display:block;text-decoration:none;}
  .gem:hover{border-color:var(--line2);background:var(--card2);}
  .gem .g-sk{font-family:var(--fm);font-size:10px;letter-spacing:2px;color:var(--orange);margin-bottom:14px;}
  .gem .g-title{font-size:13px;font-weight:700;line-height:1.65;color:var(--text);margin-bottom:18px;}
  .gem .g-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:14px;}
  .gem .g-pv{font-family:var(--fd);font-size:20px;color:var(--mut2);line-height:1;}
  .gem .g-read{font-family:var(--fm);font-size:9px;letter-spacing:1px;color:var(--text);border:1px solid var(--line2);padding:4px 10px;border-radius:var(--r2);transition:all var(--tr);}
  .gem:hover .g-read{background:var(--acc);color:var(--acc-text);border-color:var(--acc);}

  .worst-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .worst-card{padding:24px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .worst-card:hover{border-color:var(--line2);}
  .worst-card.open{background:var(--orange);border-color:var(--orange);}
  .worst-card.open *{color:#fff;}

  .cta-banner{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:32px;flex-wrap:wrap;border-left:3px solid var(--orange);}
  .cta-banner .ct{font-family:var(--fh);font-weight:800;font-size:clamp(18px,3vw,24px);color:var(--text);letter-spacing:-0.01em;}
  .cta-banner .cs{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.8;}

  .member{display:grid;grid-template-columns:1.4fr 1fr;gap:48px;align-items:center;}
  .member-card{padding:40px 32px;text-align:center;}
  .member-price{font-family:var(--fd);font-weight:700;font-size:56px;color:var(--text);line-height:1;margin-bottom:6px;letter-spacing:-0.02em;}
  .member-price span{font-size:16px;color:var(--mut);font-weight:400;}
  .perk{display:flex;align-items:flex-start;gap:12px;font-size:13px;line-height:1.8;color:var(--text2);margin-top:14px;}
  .perk::before{content:'';width:5px;height:5px;background:var(--orange);flex-shrink:0;margin-top:9px;}

  .footer{padding:96px 0 72px;text-align:center;background:var(--bg2);border-top:1px solid var(--line);}
  .footer-big{font-family:var(--fh);font-weight:800;line-height:.92;color:var(--text);letter-spacing:-0.03em;}
  .footer-big .a{font-size:clamp(80px,16vw,160px);}
  .footer-big .b{font-size:clamp(36px,8vw,76px);color:var(--orange);}
  .footer p{font-size:13px;color:var(--mut);max-width:420px;margin:24px auto 0;line-height:1.9;}
  .footer-meta{margin-top:32px;font-family:var(--fm);font-size:10px;letter-spacing:3px;color:var(--faint);border-bottom:1px solid var(--line2);padding-bottom:6px;display:inline-block;}
  .footer-links{margin-top:16px;font-family:var(--fm);font-size:10px;letter-spacing:2px;}
  .footer-links a{color:var(--mut);text-decoration:none;}
  .footer-links a:hover{text-decoration:underline;}
  .footer-links a.o{color:var(--orange);}
  .footer-links .sep{margin:0 10px;color:var(--line2);}

  /* ══════════ フォロワーセクション ══════════ */
  .fol-grid{display:grid;grid-template-columns:0.9fr 1.5fr;gap:40px;align-items:start;margin-top:32px;}
  .fol-now{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  .fol-num{font-family:var(--fd);font-weight:700;font-size:clamp(40px,5.5vw,60px);line-height:1;color:var(--text);letter-spacing:-0.02em;}
  .fol-unit{font-size:13px;color:var(--mut);}
  .fol-msg{font-size:12px;color:var(--mut);margin-top:12px;line-height:1.8;}
  .fol-stats{margin-top:24px;border-top:1px solid var(--line2);}
  .fol-stat{display:flex;justify-content:space-between;align-items:baseline;padding:11px 2px;border-bottom:1px solid var(--line);gap:10px;}
  .fol-stat .k{font-family:var(--fm);font-size:10px;letter-spacing:2px;color:var(--mut);white-space:nowrap;}
  .fol-stat .v{font-family:var(--fd);font-weight:600;font-size:19px;color:var(--text);white-space:nowrap;}
  .fol-stat .v.p{color:var(--pos);}
  .fol-stat .v.n{color:var(--neg);}
  .fol-stat .v small{font-family:var(--fm);font-weight:400;font-size:10px;color:var(--mut);margin-left:4px;}
